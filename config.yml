# ============================================================================
# Marp スライド自動生成 — 設定ファイル
# ============================================================================
# Fork後にこのファイルを編集するだけでカラーテーマ・テキストルール・
# ブランド情報をプロジェクト全体に反映できます。
#
# 変更後の反映先:
#   - themes/theme.css  → CSS変数（:root）を手動で合わせる
#   - docs/             → Claude Codeが自動参照（変更不要）
#   - skills/           → Claude Codeが自動参照（変更不要）
# ============================================================================

# --------------------------------------------------------------------------
# ブランド情報
# --------------------------------------------------------------------------
brand:
  name: "My Company"
  logo: ".images/logo.png"           # ロゴ画像パス（未設定なら空文字）
  copyright: "© 2026 My Company"

# --------------------------------------------------------------------------
# カラーテーマ
# --------------------------------------------------------------------------
# theme.css の :root セクション（CSS変数）と対応しています。
# ここを変更したら theme.css の対応する変数も同じ値に更新してください。
# --------------------------------------------------------------------------
colors:
  # プライマリカラー（見出し、タイトルスライド背景）
  primary: "#1B4565"
  primary_light: "#2A5F8A"
  primary_dark: "#112D42"

  # アクセントカラー（リンク、装飾線、アイコン）
  accent: "#3E9BA4"
  accent_light: "#5BB8C0"
  accent_dark: "#2D7A82"

  # グレースケール（本文テキスト〜背景）
  grayscale:
    900: "#111827"
    800: "#1F2937"
    700: "#374151"
    600: "#4B5563"
    500: "#6B7280"
    400: "#9CA3AF"
    300: "#D1D5DB"
    200: "#E5E7EB"
    100: "#F3F4F6"
    50:  "#F9FAFB"

  # セマンティックカラー（意味のある場面でのみ使用）
  semantic:
    info:    "#3B82F6"
    success: "#10B981"
    warning: "#F59E0B"
    danger:  "#EF4444"

# --------------------------------------------------------------------------
# テキストルール
# --------------------------------------------------------------------------
# Claude Codeのスキルはこの値を参照してバリデーションを実行します。
# 値を変更するだけで生成・検証の基準が自動で変わります。
# --------------------------------------------------------------------------
text_rules:
  title:
    max_chars: 30                    # タイトルの最大文字数
    forbidden_chars: [":", "!"]      # タイトルで禁止する文字
    no_trailing_period: true         # 末尾句点の禁止

  body:
    max_chars_per_line: 45           # 1行の最大文字数
    max_chars_per_slide: 500         # 1スライドの最大文字数
    max_lines_per_slide: 14          # 1スライドの最大行数

  bullet:
    max_items: 6                     # 箇条書きの最大項目数
    max_nesting: 2                   # ネストの最大階層数

  image:
    max_per_slide: 2                 # 1スライドの最大画像数

  color:
    max_accent_per_slide: 2          # 1スライドのアクセントカラー上限

  emoji:
    max_per_slide: 2                 # 1スライドの絵文字上限（0で禁止）
    allow_in_title: false            # タイトルでの絵文字使用

  table:
    max_columns: 5                   # テーブルの最大列数
    max_rows: 7                      # テーブルの最大行数（ヘッダー含む）
    max_cell_chars: 20               # セル内の最大文字数

# --------------------------------------------------------------------------
# タイポグラフィ
# --------------------------------------------------------------------------
typography:
  font_sans: "system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif"
  font_mono: "'SF Mono', 'Fira Code', 'Fira Mono', 'Roboto Mono', Menlo, Consolas, monospace"

  sizes:
    title:    "44px"                 # スライドタイトル
    subtitle: "28px"                 # セクション見出し
    body:     "24px"                 # 本文
    small:    "18px"                 # 注釈・フッター（最小許容）
    caption:  "14px"                 # 図表キャプションのみ

  line_height: 1.6                   # 基本行間
  letter_spacing: "-0.01em"          # 基本字間

# --------------------------------------------------------------------------
# スペーシング
# --------------------------------------------------------------------------
spacing:
  base_unit: 8                       # 基本単位（px）
  slide_padding: 48                  # スライド端のパディング（px）

# --------------------------------------------------------------------------
# スライド設定
# --------------------------------------------------------------------------
slide:
  width: 1280
  height: 720
  aspect_ratio: "16:9"
  theme_name: "custom"               # Marpテーマ名（theme.css の @theme と一致）
  paginate: true
